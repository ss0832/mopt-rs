# Read the Docs: the Markdown documents of docs/source, built with Sphinx and MyST.
# The package itself is not installed (docs/source/conf.py imports nothing of it).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
