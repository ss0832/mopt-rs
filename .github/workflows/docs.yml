# The documentation as a web site on GitHub Pages.
# 
# Every push to the default branch builds docs/source with Sphinx (the same settings as
# Read the Docs, docs/source/conf.py) and publishes the pages; a pull request only builds.
# One step outside this file is needed, once: in the repository settings, Pages > Source
# must be "GitHub Actions" (the token of a workflow may not change that setting).
#
# Read the Docs builds from .readthedocs.yaml through its own connection to the repository
# (import the project at readthedocs.org; no secret is needed here). When the repository
# secrets RTD_PROJECT and RTD_TOKEN are set, the last job also asks Read the Docs for a
# build of the pushed branch, for projects that are not connected by a webhook.
name: docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install Sphinx
        run: python -m pip install -r docs/requirements.txt
      - name: Build the pages
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html
      - name: Keep the pages for the deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages takes the build of a workflow
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  readthedocs:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      RTD_PROJECT: ${{ secrets.RTD_PROJECT }}
      RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
    steps:
      - name: Ask Read the Docs for a build
        run: |
          if [ -z "$RTD_PROJECT" ] || [ -z "$RTD_TOKEN" ]; then
            echo "RTD_PROJECT and RTD_TOKEN are not set: Read the Docs builds through its own webhook."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/latest/builds/"
